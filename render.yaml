services:
  - type: web
    name: dreamslab-cloud-vault
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev && node ../scripts/build-web.cjs
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://abdullahinayat24-lang.github.io
      - key: DATABASE_URL
        sync: false
