services:
  - type: web
    name: dreamslab-cloud-vault
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: dreamslab-fixed-secure-jwt-secret-2026-production
      - key: ALLOWED_ORIGINS
        value: https://abdullahinayat24-lang.github.io,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: dreamslab-vault-db
          property: connectionString

databases:
  - name: dreamslab-vault-db
    plan: free
    databaseName: dreamslab_vault
    user: dreamslab
